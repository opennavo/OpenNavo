name: Release web and admin

# Web image and static admin bundle (09 section 6.2). Backend images/deployment config: release-server.yml; target deployment is H-25.
on:
  push:
    tags: ['web-v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-gate.yml
  web-image:
    needs: gate
    if: always() && (needs.gate.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.gate.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennavo-web
          tags: |
            type=ref,event=tag
            type=raw,value=local,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        # Keep GitHub event data out of logs and downloadable build records.
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          provenance: false
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  admin-bundle:
    needs: gate
    if: always() && (needs.gate.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.gate.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@opennavo/admin..."
      # Production API requests use same-origin /admin-api through Caddy; artifacts are not bound to a domain.
      - run: pnpm --filter @opennavo/admin build
      - run: |
          mkdir -p apps/admin/dist/third-party
          cp -R docs/legal/third-party/. apps/admin/dist/third-party/
      - run: tar -czf admin-dist.tar.gz -C apps/admin/dist .
      - uses: actions/upload-artifact@v6
        with:
          name: admin-dist-${{ github.ref_name }}
          path: admin-dist.tar.gz
