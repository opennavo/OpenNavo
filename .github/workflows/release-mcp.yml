name: Release MCP image
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: release-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'push'
    uses: ./.github/workflows/release-gate.yml
  checks:
    needs: gate
    if: always() && (needs.gate.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.gate.result == 'skipped'))
    uses: ./.github/workflows/ci-mcp.yml
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/opennavo-mcp
          tags: |
            type=ref,event=tag
            type=raw,value=local,enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v7
        # Keep GitHub event data out of logs and downloadable build records.
        env:
          BUILDX_METADATA_PROVENANCE: disabled
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          provenance: false
          context: apps/mcp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max
