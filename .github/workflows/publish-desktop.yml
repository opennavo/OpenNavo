name: Publish desktop update
on:
  workflow_dispatch:
    inputs:
      version:
        description: Signed GitHub release version to activate (for example 0.1.1)
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: desktop-v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node .github/scripts/require-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify completed signed release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          version=os.environ['VERSION']
          release=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases/tags/desktop-v{version}']))
          assert not release['draft'], 'GitHub release must be public'
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/workflows/release-desktop.yml/runs?head_sha={sha}&event=push&per_page=100']))['workflow_runs']
          runs=[r for r in runs if r['head_branch']=='desktop-v'+version]
          assert runs and max(runs,key=lambda r:r['run_number'])['conclusion']=='success', 'Signed release workflow must pass'
          PY
      - name: Activate update manifest
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: python3 .github/scripts/send-deployment.py --desktop-version "$VERSION"
