global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files: [/etc/prometheus/rules.yml]
scrape_configs:
  - job_name: api
    honor_labels: true
    dns_sd_configs:
      - names: [api]
        type: A
        port: 9090
        refresh_interval: 30s
  - job_name: asynq
    static_configs:
      - targets: ['asynqmon:8080']
