openapi: 3.0.3
info:
  title: OpenNavo Public API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://opennavo.example/terms
  description: "Public API for the web and macOS clients.\n\n- All response bodies use `{code, msg, data}`; success is `code = \"0000\"`.\n- Public endpoints use semantic HTTP status codes; errors have null data.\n- Fields use camelCase; timestamps use RFC 3339 (UTC).\n- Localization prefers the `locale` query parameter, then `Accept-Language`, and defaults to `en-US`.\n- Pagination requests use `current` (starting at 1) and `size`; responses use `{current, size, total, records}`.\n\nM8-02: all catalog responses, snapshots and deltas contain Casks only; explicit kind=formula returns 404. Formula dependencies of Casks retain names but have no catalog links.\nSix-language negotiation prefers locale over Accept-Language (by q value), defaulting to en-US. Content falls back from the requested language to en-US, then the object's source language. Optional sourceLocale identifies the source language; machineTranslated describes the text actually returned. Select Prism's static six-language examples with Prefer: example=<locale-code>; locale does not switch them automatically."
servers:
  - url: https://api.opennavo.example/api/v1
  - url: http://localhost:8080/api/v1
security: []
tags:
  - name: home
    description: "Home"
  - name: catalog
    description: "Catalog: categories, package lists, details and dependencies"
  - name: releases
    description: "Release history"
  - name: search
    description: "Search and suggestions"
  - name: rankings
    description: "Installation rankings"
  - name: collections
    description: "Collections"
  - name: desktop
    description: "Client-specific: snapshots, deltas, configuration and releases"
  - name: feedback
    description: "User feedback"

paths:
  /home:
    get:
      tags:
        - home
      operationId: getHome
      summary: "Home page data"
      parameters:
        - $ref: "#/components/parameters/Locale"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
              examples:
                en-US:
                  summary: en-US
                  value:
                    code: "0000"
                    msg: ok
                    data:
