      type: object
      additionalProperties: false
      required:
        - locale
        - version
        - cursor
        - url
        - sha256
        - bytes
      properties:
        locale:
          $ref: "#/components/schemas/Locale"
        version:
          type: integer
          format: int64
          minimum: 0
          example: 1790755200000
        cursor:
          type: integer
          format: int64
          minimum: 0
          example: 60
        url:
          type: string
          format: uri
          example: https://cdn.opennavo.example/snapshots/text-v2-ja-JP-60-local.json.gz
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        bytes:
          type: integer
          format: int64
          minimum: 0
          example: 1200
      description: "Single-language text-pack metadata. version is this language file's build version (a monotonically increasing millisecond timestamp); cursor is the cursor of the consistent catalog view, and need not equal version. Hash and size refer to gzip data. The base and six text packs come from one repeatable-read view; replace latest metadata only after publishing every object."
      example:
        locale: ja-JP
        version: 1790755200000
        cursor: 60
        url: https://cdn.opennavo.example/snapshots/text-v2-ja-JP-60-local.json.gz
        sha256: "3333333333333333333333333333333333333333333333333333333333333333"
        bytes: 1200
