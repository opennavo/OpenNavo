components:
  parameters:
    Locale:
      name: locale
      in: query
      schema:
        $ref: "#/components/schemas/Locale"
      description: "locale > Accept-Language (six languages matched by q value) > en-US. Missing translations fall back to en-US, then the source language."
    KindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/PackageKind' }
    KindQuery:
      name: kind
      in: query
      schema: { $ref: '#/components/schemas/PackageKind' }
    TokenPath:
      name: token
      in: path
      required: true
      description: "Homebrew token; may contain `@`, for example `python@3.14`"
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9@._+-]*$', maxLength: 128, example: visual-studio-code }
    SlugPath:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$', maxLength: 64, example: new-mac }
    Current:
      name: current
      in: query
      schema: { type: integer, minimum: 1, default: 1, example: 1 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24, example: 24 }

  responses:
    Error:
      description: "Error response; see the domain error codes in apps/server/internal/domain. data is null."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Code:
      type: string
      description: "Business code; \"0000\" means success"
      example: "0000"
    Locale:
      type: string
      enum:
        - en-US
        - zh-CN
        - ja-JP
        - es-ES
        - pt-BR
        - ru-RU
      example: en-US
      description: "Supported language; without locale, match Accept-Language by q value and ultimately default to en-US."
    PackageKind:
      type: string
      enum:
        - cask
        - formula
      example: cask
      description: "Casks only. The formula enum remains for old-request compatibility; explicit requests return 404. Historical data is not deleted."
    ErrorResponse:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          $ref: "#/components/schemas/Code"
        msg:
          type: string
          example: ok
        data:
          type: object
          nullable: true
      example:
        code: "1002"
        msg: ok
        data: null
    EmptyResponse:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          $ref: "#/components/schemas/Code"
        msg:
          type: string
          example: ok
        data:
          type: object
          nullable: true
      example:
        code: "0000"
        msg: ok
        data: null
    IdResponse:
      type: object
      required:
        - code
        - msg
        - data
      properties:
        code:
          $ref: "#/components/schemas/Code"
        msg:
          type: string
          example: ok
        data:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
              example: 1
      example:
        code: "0000"
        msg: ok
        data:
          id: 1
    CategoryRef:
      type: object
      required:
        - slug
        - name
        - icon
      properties:
        slug:
          type: string
          example: developer-tools
        name:
          type: string
          example: 开发工具
        icon:
          type: string
          example: lucide:code-xml
        sourceLocale:
          $ref: "#/components/schemas/Locale"
        machineTranslated:
          type: boolean
          description: "Whether the returned text is machine-translated; false for source fallback or manual translations."
          example: false
      example:
        slug: developer-tools
        name: Developer Tools
        icon: lucide:code-xml
        sourceLocale: en-US
        machineTranslated: false
    PackageSummary:
      type: object
      required:
        - kind
        - token
        - name
        - displayName
        - version
        - installs30d
        - autoUpdates
        - deprecated
        - disabled
        - isFont
        - isLibrary
        - editorChoice
        - versionChangedAt
      properties:
        kind:
          $ref: "#/components/schemas/PackageKind"
        token:
          type: string
          example: visual-studio-code
        name:
          type: string
          example: Microsoft Visual Studio Code
        displayName:
          type: string
          description: "Display name in the negotiated language; falls back to en-US, then the source language. Brand names may remain unchanged."
          example: Visual Studio Code
        summary:
          type: string
          nullable: true
          description: "Localized one-sentence summary"
          example: 开源代码编辑器，支持调试、扩展与智能代码辅助
        iconUrl:
          type: string
          nullable: true
          example: null
        accentColor:
          type: string
          nullable: true
          pattern: ^#[0-9A-Fa-f]{6}$
          example: null
        version:
          type: string
          example: 1.140.0
        primaryCategory:
          type: object
          allOf:
            - $ref: "#/components/schemas/CategoryRef"
          nullable: true
        installs30d:
          type: integer
          example: 17392
        rank30d:
          type: integer
          nullable: true
          example: 9
        autoUpdates:
          type: boolean
          example: true
        deprecated:
          type: boolean
          example: false
        disabled:
          type: boolean
          example: false
        isFont:
          type: boolean
          example: false
        isLibrary:
          type: boolean
          example: false
        editorChoice:
          type: boolean
          example: true
        versionChangedAt:
          type: string
          format: date-time
          example: 2026-09-30T08:00:00Z
        sourceLocale:
          $ref: "#/components/schemas/Locale"
        machineTranslated:
          type: boolean
          description: "Whether the returned text is machine-translated; false for source fallback or manual translations."
          example: false
      example:
        kind: cask
        token: visual-studio-code
        name: Microsoft Visual Studio Code
        displayName: Visual Studio Code
        summary: Code editor with debugging and extensions
        iconUrl: null
        accentColor: null
        version: 1.140.0
        primaryCategory:
          slug: developer-tools
          name: Developer Tools
          icon: lucide:code-xml
          sourceLocale: en-US
          machineTranslated: false
        installs30d: 17392
        rank30d: 9
        autoUpdates: true
        deprecated: false
        disabled: false
        isFont: false
        isLibrary: false
        editorChoice: true
        versionChangedAt: 2026-09-30T08:00:00Z
        sourceLocale: en-US
        machineTranslated: false
    InstallStats:
      type: object
      required:
        - d30
        - d90
        - d365
      properties:
        d30:
          type: integer
          example: 17392
        d90:
          type: integer
          example: 101147
        d365:
          type: integer
          example: 478472
      example:
        d30: 17392
        d90: 101147
        d365: 478472
    Artifacts:
      type: object
      required:
        - apps
        - binaries
        - pkgs
      properties:
        apps:
          type: array
          items:
            type: string
            example: Visual Studio Code.app
          example:
            - Visual Studio Code.app
        binaries:
          type: array
          items:
            type: string
            example: code
          example:
            - code
        pkgs:
          type: array
          items:
            type: string
            example: 本地演示样本
        uninstallNotes:
          type: array
          description: "Localized uninstall actions, such as \"Quit App\" or \"Remove background task com.microsoft.VSCode.ShipIt\""
          items:
            type: string
            example: 本地演示样本
        entries:
          type: array
          description: "Complete Homebrew install, uninstall and cleanup declarations for display only; never execute their scripts. target appears only when explicitly declared upstream and is not the actual local install path."
          items:
            $ref: "#/components/schemas/CaskArtifact"
      example:
        apps:
          - Visual Studio Code.app
        binaries:
          - code
        pkgs: []
        uninstallNotes: []
        entries:
          - type: app
            phase: install
            sources: [Visual Studio Code.app]
            target: null
            declaration:
              app: [Visual Studio Code.app]
    CaskArtifact:
      type: object
      required: [type, phase, sources, declaration]
      example:
        type: app
        phase: install
        sources: [Visual Studio Code.app]
        target: null
        declaration:
          app: [Visual Studio Code.app]
      properties:
        type:
          type: string
          description: "Homebrew declaration type; unknown types are preserved unchanged."
          example: app
        phase:
          type: string
          enum: [install, uninstall, cleanup]
          example: install
        sources:
          type: array
          items:
            type: string
          example: [Visual Studio Code.app]
        target:
          type: string
          nullable: true
          example: null
        declaration:
          type: object
          additionalProperties: true
          description: "Complete upstream declaration, preserving arguments, scripts, explicit targets and future fields."
          example:
            app: [Visual Studio Code.app]
    CaskPlatform:
      type: object
      description: "macOS platforms from supported_platforms after applying variations using Homebrew whole-field overrides. Installability may depend on Rosetta and does not indicate native binary architecture."
      required: [tag, macos, arch, version, requiresRosetta, dependsOn, artifacts, conflictsWith]
      example:
        tag: arm64_sonoma
        macos: "14"
        arch: arm64
        version: 1.140.0
        downloadUrl: https://update.code.visualstudio.com/1.140.0/darwin-arm64/stable
        downloadSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        minMacos: null
        requiresRosetta: false
        dependsOn:
          macos: null
          arch: [arm64]
          formulae: []
          casks: []
          requirements:
            macos: {}
        artifacts:
          apps: [Visual Studio Code.app]
          binaries: []
          pkgs: []
          entries:
            - type: app
              phase: install
              sources: [Visual Studio Code.app]
              target: null
              declaration:
                app: [Visual Studio Code.app]
        conflictsWith:
          casks: []
          formulae: []
      properties:
        tag:
          type: string
          example: arm64_sonoma
        macos:
          type: string
          description: "macOS version associated with the platform label, not the application's minimum OS requirement."
          example: "14"
        arch:
          type: string
          enum: [arm64, x86_64]
