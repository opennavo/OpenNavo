[[permission]]
identifier = "native-main"
description = "Main window access to the specified client commands"
commands.allow = [
  "app_info", "env_detect", "catalog_status", "catalog_sync", "catalog_search", "catalog_list", "catalog_get", "catalog_categories",
  "library_list", "library_refresh", "library_storage", "updates_list", "updates_check", "updates_ignore", "updates_unignore", "updates_status",
  "install_preflight", "apps_running", "task_enqueue", "task_enqueue_many", "task_cancel", "task_list_active", "task_log", "history_list", "history_clear", "history_export_csv",
  "locale_get", "settings_get", "settings_set", "mirror_probe", "brewfile_export", "brewfile_preview", "brewfile_install", "cleanup_estimate", "doctor_run",
  "app_open", "app_reveal", "system_open_privacy", "app_quit",
  "permissions_get", "permission_guide_open", "permission_guide_close"
]

[[permission]]
identifier = "native-tray"
description = "Popover can read effective locale, local updates and installed packages, and operate the existing queue; no full settings access"
commands.allow = [
  "locale_get", "library_list", "updates_list", "updates_check", "updates_ignore", "updates_unignore", "updates_status",
  "task_enqueue", "task_enqueue_many", "task_cancel", "task_list_active", "task_log"
]

[[permission]]
identifier = "native-guide"
description = "Permission overlay can only read effective locale and permissions, start dragging the OpenNavo icon, and close itself"
commands.allow = [
  "locale_get", "permissions_get", "permission_guide_info", "permission_guide_drag", "permission_guide_close"
]
